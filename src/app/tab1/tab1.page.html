<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Linear regression
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="tab1-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Linear regression</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="touch-container" #touchContainer (pointerdown)="onTap($event)">
    <div class="status-panel ignore-tap">
      <div class="status-line">Captured {{ points().length }} of 4 points</div>
      <div class="status-hint" *ngIf="canCapture()">Tap or click inside the area to add a point.</div>
      <div class="status-hint complete" *ngIf="!canCapture()">4 points captured. Tap Reset to clear.</div>
      <ion-button fill="outline" color="danger" size="small" (click)="resetPoints()" class="action-button ignore-tap">
        Reset/Clear
      </ion-button>
    </div>

    <!-- SVG slope line overlay -->
    <svg class="slope-svg" *ngIf="lineCoords() as lc" [attr.width]="lc.width" [attr.height]="lc.height">
      <line
        [attr.x1]="lc.x1"
        [attr.y1]="lc.y1"
        [attr.x2]="lc.x2"
        [attr.y2]="lc.y2"
        stroke="#888"
        stroke-width="2"
        stroke-dasharray="6 6"
        stroke-linecap="round"
      ></line>
    </svg>

    <!-- predictive 5th point (blue, double radius) -->
    <ng-container *ngIf="regression()">
      <div
        class="pred-dot"
        *ngIf="regression()"
        [style.left.px]="regression()?.x5"
        [style.top.px]="regression()?.y5"
        aria-hidden="false"
      ></div>
    </ng-container>

    <div
      class="point-dot"
      *ngFor="let point of points(); let i = index"
      [style.left.px]="xOf(point)"
      [style.top.px]="yOf(point)"
      [attr.aria-label]="ariaLabel(point, i)"
    ></div>
  </div>
</ion-content>
